<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Kinetic Crystal - Tối Giản & Siêu Nhẹ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & OrbitControls (Bản chuẩn siêu nhẹ, không cần thư viện phụ) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(
          circle at 50% 50%,
          #111422 0%,
          #05060a 100%
        );
      }
    </style>
  </head>
  <body
    class="relative w-screen h-screen select-none overflow-hidden text-white font-sans"
  >
    <!-- WebGL Canvas -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- Tiêu đề tối giản phong cách Zen Art -->
    <div class="absolute top-8 left-8 z-10 pointer-events-none">
      <h1 class="text-xs uppercase tracking-[0.35em] text-zinc-400 font-medium">
        Kinetic Sculpture
      </h1>
      <p
        id="gem-title"
        class="text-xl font-light tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-rose-300 to-indigo-300"
      >
        Khối Ngọc Vô Cực
      </p>
    </div>

    <!-- Thanh công cụ tương tác tinh giản -->
    <div
      class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 flex items-center gap-3 px-5 py-2.5 rounded-full bg-white/[0.04] backdrop-blur-xl border border-white/10 shadow-2xl"
    >
      <!-- Nút đổi hình thể khối ngọc -->
      <button
        id="btn-shape"
        class="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-xs tracking-wider transition-all duration-300 active:scale-95 flex items-center gap-2"
      >
        <span class="w-2 h-2 rounded-full bg-rose-400"></span>
        <span id="shape-name">DÁNG: ĐA DIỆN</span>
      </button>

      <!-- Nút đổi bảng màu -->
      <button
        id="btn-palette"
        class="px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 text-xs tracking-wider transition-all duration-300 active:scale-95 flex items-center gap-2"
      >
        <span class="w-2 h-2 rounded-full bg-amber-300"></span>
        <span id="palette-name">MÀU: VÀNG HỒNG</span>
      </button>
    </div>

    <script>
      const container = document.getElementById("canvas-container");

      // --- KHỞI TẠO SCENE & CAMERA ---
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 0, 18);

      // Renderer tối ưu hóa hiệu năng tối đa (Không dùng Post-Processing nặng)
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enableZoom = true;
      controls.minDistance = 8;
      controls.maxDistance = 30;

      // --- HỆ THỐNG ÁNH SÁNG NGHỆ THUẬT (3 ĐÈN ĐỔ BÓNG KIM LOẠI MỊN) ---
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      // Đèn chính: Ánh ấm tạo highlight kim loại
      const keyLight = new THREE.PointLight(0xffd1b3, 3.2, 50);
      keyLight.position.set(12, 15, 12);
      scene.add(keyLight);

      // Đèn phụ: Ánh lam/tím lạnh tạo độ sâu đa sắc
      const fillLight = new THREE.PointLight(0x80bfff, 2.5, 50);
      fillLight.position.set(-14, -10, -10);
      scene.add(fillLight);

      // --- CÁC BẢNG MÀU SANG TRỌNG ---
      const PALETTES = [
        {
          name: "VÀNG HỒNG",
          gem: 0xffe3e0,
          ring: 0xf6c28b,
          light1: 0xffd1b3,
          light2: 0x9fb4ff,
        },
        {
          name: "NGỌC BÍCH",
          gem: 0xd4f8ea,
          ring: 0x52b788,
          light1: 0xa7f3d0,
          light2: 0x38bdf8,
        },
        {
          name: "LAM HUYỀN",
          gem: 0xe0e7ff,
          ring: 0x818cf8,
          light1: 0x67e8f9,
          light2: 0xc084fc,
        },
        {
          name: "HẮC KIM",
          gem: 0xfef08a,
          ring: 0xeab308,
          light1: 0xfde047,
          light2: 0xf43f5e,
        },
      ];
      let currentPaletteIdx = 0;

      // --- VẬT LIỆU CAO CẤP NHƯNG SIÊU NHẸ (MESH STANDARD) ---
      const gemMaterial = new THREE.MeshStandardMaterial({
        color: PALETTES[0].gem,
        metalness: 0.85,
        roughness: 0.15,
        flatShading: true, // Cắt vát đa giác tạo hiệu ứng kim cương lấp lánh
      });

      const wireMaterial = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.15,
      });

      const ringMaterial = new THREE.MeshStandardMaterial({
        color: PALETTES[0].ring,
        metalness: 0.95,
        roughness: 0.18,
      });

      // --- TẠO KHỐI NGỌC TRUNG TÂM (3 HÌNH THỂ CÓ THỂ ĐỔI) ---
      const SHAPES = [
        { name: "ĐA DIỆN", geo: new THREE.IcosahedronGeometry(2.3, 0) }, // 20 mặt kim cương
        {
          name: "VÒNG XOẮN",
          geo: new THREE.TorusKnotGeometry(1.4, 0.45, 64, 8),
        }, // Nút thắt vô cực
        { name: "BÁT DIỆN", geo: new THREE.OctahedronGeometry(2.4, 0) }, // 8 mặt sắc nét
      ];
      let currentShapeIdx = 0;

      const crystalGroup = new THREE.Group();

      let coreMesh = new THREE.Mesh(SHAPES[0].geo, gemMaterial);
      let wireMesh = new THREE.Mesh(SHAPES[0].geo, wireMaterial);
      wireMesh.scale.setScalar(1.002);

      crystalGroup.add(coreMesh);
      crystalGroup.add(wireMesh);

      // --- 3 VÒNG GIMBAL ĐỘNG HỌC (GYROSCOPIC RINGS) ---
      const rings = [];
      const ringRadii = [3.8, 4.7, 5.6];

      ringRadii.forEach((radius, idx) => {
        const ringGeo = new THREE.TorusGeometry(radius, 0.05, 12, 64);
        const ringMesh = new THREE.Mesh(ringGeo, ringMaterial);

        // Góc nghiêng ban đầu đối xứng
        ringMesh.rotation.x = (idx * Math.PI) / 3;
        ringMesh.rotation.y = (idx * Math.PI) / 4;

        crystalGroup.add(ringMesh);
        rings.push(ringMesh);
      });

      scene.add(crystalGroup);

      // --- 300 HẠT ĐOM ĐÓM LƠ LỬNG (300 PARTICLES ~ 0% GPU) ---
      const PARTICLE_COUNT = 300;
      const particleGeo = new THREE.BufferGeometry();
      const pPositions = new Float32Array(PARTICLE_COUNT * 3);

      for (let i = 0; i < PARTICLE_COUNT * 3; i += 3) {
        pPositions[i] = (Math.random() - 0.5) * 25;
        pPositions[i + 1] = (Math.random() - 0.5) * 20;
        pPositions[i + 2] = (Math.random() - 0.5) * 20;
      }
      particleGeo.setAttribute(
        "position",
        new THREE.BufferAttribute(pPositions, 3),
      );

      const particleMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.08,
        transparent: true,
        opacity: 0.55,
      });
      const particleField = new THREE.Points(particleGeo, particleMat);
      scene.add(particleField);

      // --- TƯƠNG TÁC ĐỔI DÁNG & BẢNG MÀU ---
      const btnShape = document.getElementById("btn-shape");
      const shapeName = document.getElementById("shape-name");

      btnShape.addEventListener("click", () => {
        currentShapeIdx = (currentShapeIdx + 1) % SHAPES.length;
        const s = SHAPES[currentShapeIdx];
        shapeName.textContent = `DÁNG: ${s.name}`;

        coreMesh.geometry.dispose();
        wireMesh.geometry.dispose();

        coreMesh.geometry = s.geo;
        wireMesh.geometry = s.geo;
      });

      const btnPalette = document.getElementById("btn-palette");
      const paletteName = document.getElementById("palette-name");

      btnPalette.addEventListener("click", () => {
        currentPaletteIdx = (currentPaletteIdx + 1) % PALETTES.length;
        const p = PALETTES[currentPaletteIdx];
        paletteName.textContent = `MÀU: ${p.name}`;

        gemMaterial.color.set(p.gem);
        ringMaterial.color.set(p.ring);
        keyLight.color.set(p.light1);
        fillLight.color.set(p.light2);
      });

      // --- HIỆU ỨNG DI CHUỘT PARALLAX NHẸ NHÀNG ---
      let mouseX = 0;
      let mouseY = 0;
      window.addEventListener("mousemove", (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 0.4;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 0.4;
      });

      // --- VÒNG LẶP CHUYỂN ĐỘNG (60 FPS MƯỢT MÀ) ---
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const time = clock.getElapsedTime();

        // 1. Tự quay của khối ngọc trung tâm
        coreMesh.rotation.x = time * 0.35;
        coreMesh.rotation.y = time * 0.45;
        wireMesh.rotation.x = time * 0.35;
        wireMesh.rotation.y = time * 0.45;

        // Nhịp thở nhè nhẹ của khối ngọc
        const breathe = 1.0 + Math.sin(time * 1.8) * 0.035;
        coreMesh.scale.set(breathe, breathe, breathe);
        wireMesh.scale.set(breathe * 1.002, breathe * 1.002, breathe * 1.002);

        // 2. Chuyển động độc lập của 3 vòng Gimbal
        rings[0].rotation.x = time * 0.4;
        rings[0].rotation.y = time * 0.25;

        rings[1].rotation.y = -time * 0.3;
        rings[1].rotation.z = time * 0.35;

        rings[2].rotation.z = time * 0.25;
        rings[2].rotation.x = -time * 0.45;

        // 3. Khối điêu khắc lơ lửng dập dềnh theo trục Y + bám nhẹ theo chuột
        crystalGroup.position.y = Math.sin(time * 1.2) * 0.35 + mouseY * -2;
        crystalGroup.position.x = mouseX * 2;

        // 4. Đom đóm trôi nhẹ nhàng
        particleField.rotation.y = time * 0.02;

        controls.update();
        renderer.render(scene, camera);
      }

      animate();

      // Cân chỉnh cửa sổ
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
